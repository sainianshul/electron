# ============================================================
# Eclipse Mosquitto Configuration (Smart Home MQTT Broker)
# ============================================================

# Standard MQTT listener for Hardware (NodeMCU / ESP8266 / ESP32)
listener 1883 0.0.0.0
allow_anonymous true

# WebSockets listener (for Web/Browser MQTT connections)
listener 9001 0.0.0.0
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
